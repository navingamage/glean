name = "glean"
main = "src/index.ts"
compatibility_date = "2026-08-19"

# One door, on purpose. A workers.dev URL bypasses anything sitting in front of
# the custom domain, so leaving it enabled would mean Cloudflare Access guards
# glean.antipodetech.com while the same Worker stays reachable beside it.
workers_dev = false
preview_urls = false

routes = [{ pattern = "glean.antipodetech.com", custom_domain = true }]

# A Worker rather than a Pages project, for one reason: Pages Functions cannot
# be scheduled. The entire premise of glean is that it looks for this money
# without being asked, and a deployment that only runs when someone visits it
# would give that back.
# Every ten minutes, each run doing a little.
#
# One invocation cannot walk the registry. Wall clock is the binding constraint,
# not subrequests: a prime extraction takes five to twenty seconds, so a pass is
# held to twenty seconds and gets through a handful of pages. Sources are taken
# least-recently-scanned first, so coverage rotates rather than rescanning the
# top of the list forever.
#
# Frequent runs are cheap because they are mostly idle work: a page whose text
# has not changed is never sent to a model, so once the backlog clears these
# invocations cost requests rather than money.
[triggers]
crons = ["*/10 * * * *"]

# Why three quarters of scheduled runs die, recorded here so it is not
# rediscovered.
#
# The scan is cut off with `exceededCpu` after ten milliseconds of CPU. Ten is
# the Workers free plan ceiling and this account is on the free plan, so
# `[limits] cpu_ms` cannot be raised: wrangler refuses the deploy outright with
# "CPU limits are not supported for the Free plan".
#
# A pass needs far more than ten milliseconds. Measured over five days its CPU
# runs from fifty milliseconds to 783, because it parses up to forty documents
# with an HTML parser written in TypeScript, and parsing is the expensive part.
# Wall clock is not the problem: a pass spends twenty seconds mostly waiting on
# other people's servers, which costs no CPU at all.
#
# So the pass records `scan-started`, works until the platform stops it, and
# never writes its summary. Six starts an hour, one or two finishes.
#
# The budget the scan enforces is wall clock, and the limit that kills it is
# CPU. Those are different clocks and the Worker cannot read the one that
# matters, so it has no way to stop just short.

# Logs, so a pass that misbehaves can be read rather than guessed at.
[observability]
enabled = true

# The database this was deployed against was deleted in September 2026 along
# with the rest of the hosting, so this id is a placeholder. `wrangler d1 create
# glean` prints a new one, and `npm run db:remote` applies schema.sql to it.
[[d1_databases]]
binding = "DB"
database_name = "glean"
database_id = "REPLACE_WITH_A_NEW_DATABASE_ID"

[vars]
# Both tiers, overridable without a code change. See docs/models.md.
GLEAN_MODEL_CHEAP = "google/gemini-2.5-flash-lite"
GLEAN_MODEL_PRIME = "google/gemini-3.7-flash"
# Sized for ten milliseconds of CPU, which is what the free plan allows and
# what the comment above [observability] explains.
#
# These were forty, forty and three, and a pass that big is killed partway
# through and records nothing: six starts an hour and one finish. Small passes
# that complete beat large ones that do not, because a pass cut off has still
# spent the requests and thrown away what it learned. The scan already resumes
# where it stopped, so throughput comes from the cron firing 144 times a day
# rather than from any one pass being large.
#
# Raise these together with `[limits] cpu_ms` if this ever moves to a paid plan.
GLEAN_PER_SOURCE = "3"
# Also under the platform subrequest cap, which is 50 on free.
GLEAN_REQUEST_BUDGET = "4"
# Wall clock, and not the thing that kills a pass. Lowered so a pass that is
# going to be stopped is stopped by its own budget first, where it can write
# down what it did.
GLEAN_DEADLINE_MS = "5000"
GLEAN_MAX_EXTRACTIONS = "1"

# Secrets, set with `wrangler secret put <name>`, never written to this file:
#   OPENROUTER_API_KEY   required for class definitions
#   GLEAN_OPENROUTER_BASE  optional; where the model calls go. Unset means
#                          OpenRouter directly. Set it to a Cloudflare AI
#                          Gateway's OpenRouter endpoint,
#                          https://gateway.ai.cloudflare.com/v1/<account>/<gateway>/openrouter,
#                          for token counts, costs, retries and an optional
#                          cache. The body and the Authorization header pass
#                          through untouched, so the answer does not change.
#   GLEAN_USERNAME       optional; the dashboard sign-in, "test" when unset
#   GLEAN_PASSWORD       optional; the dashboard sign-in, "test" when unset
#   GLEAN_WEBHOOK        optional; where the digest is posted
#
# The sign-in defaults to test / test so a fresh deployment can be opened by
# anyone it is shown to. Set both before the store holds a real profile.
